<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAS R ID</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;background:#000;color:#fff;overflow-x:hidden}
.background{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.72)),url("1000000058.jpg");background-size:cover;background-position:center;background-repeat:no-repeat}
.container{width:100%;max-width:550px;min-height:100vh;margin:auto;padding:55px 20px 40px;display:flex;flex-direction:column;align-items:center}
.title{font-size:42px;font-weight:900;letter-spacing:5px;text-align:center;margin-bottom:8px;text-shadow:0 0 10px #fff,0 0 25px rgba(255,255,255,.5);animation:fromLeft .8s ease both}
.subtitle{font-size:13px;letter-spacing:3px;color:#ddd;margin-bottom:35px;text-align:center;animation:fromLeft .8s .12s ease both}
.page{width:100%}
.hidden{display:none!important}
.welcome{min-height:50vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;animation:fromLeft .8s ease both}
.welcome h2{font-size:30px;letter-spacing:2px;margin-bottom:12px}
.welcome p{font-size:14px;color:#ddd}
.tap{margin-top:25px;padding:10px 20px;border:1px solid rgba(255,255,255,.4);border-radius:30px;background:rgba(0,0,0,.4);font-size:13px;color:#eee}
.menu{width:100%;display:flex;flex-direction:column;gap:15px}
.menu a,.back{width:100%;min-height:72px;display:flex;align-items:center;padding:12px 20px;color:#fff;text-decoration:none;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.3);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 25px rgba(0,0,0,.5);cursor:pointer;opacity:0;transform:translateX(-100vw);animation:slideRight .75s cubic-bezier(.22,.8,.25,1) forwards}
.menu a:nth-child(1){animation-delay:.15s}.menu a:nth-child(2){animation-delay:.3s}.menu a:nth-child(3){animation-delay:.45s}.menu a:nth-child(4){animation-delay:.6s}
.menu a:hover,.back:hover{transform:translateY(-3px);background:rgba(255,255,255,.14);border-color:#fff}
.icon{width:48px;height:48px;display:flex;justify-content:center;align-items:center;font-size:30px;flex-shrink:0}
.whatsapp .icon{color:#25d366}
.diamond .icon{color:#65dcff;text-shadow:0 0 12px #65dcff}
.social .icon{color:#ff69c9;text-shadow:0 0 12px #ff69c9}
.text{margin-left:16px;font-size:17px;font-weight:bold;text-align:left}
.small{display:block;margin-top:4px;font-size:12px;font-weight:normal;color:#ccc}
.back{margin-top:18px;justify-content:center!important;min-height:52px!important;background:rgba(255,255,255,.1)!important;animation-delay:.75s!important}
.footer{margin-top:35px;font-size:12px;color:#aaa;letter-spacing:1px;text-align:center}
@keyframes slideRight{from{opacity:0;transform:translateX(-100vw)}to{opacity:1;transform:translateX(0)}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:600px){.container{padding:40px 16px 30px}.title{font-size:34px}.welcome h2{font-size:25px}.menu a,.back{min-height:68px;padding:10px 16px}.text{font-size:16px}}
</style>
</head>
<body>
<div class="background"></div>
<div class="container">
<h1 class="title">MAS R ID</h1>
<div class="subtitle">OFFICIAL PAGE</div>

<section id="home" class="page welcome" onclick="showMenu()">
<h2>SELAMAT DATANG</h2>
<p>Selamat datang di halaman MAS R ID</p>
<div class="tap">KLIK UNTUK MELIHAT MENU</div>
</section>

<section id="menuPage" class="page hidden">
<div class="menu">

<a class="whatsapp" href="https://chat.whatsapp.com/BG8MSjmLT1XEeTgRlDuyDb?s=cl&p=a&ilr=0" target="_blank" rel="noopener noreferrer">
<div class="icon"><i class="fa-brands fa-whatsapp"></i></div>
<div class="text">GABUNG GRUB WHATSAPP<span class="small"></span></div>
</a>

<a class="whatsapp" href="https://wa.me/6282117892126" target="_blank" rel="noopener noreferrer">
<div class="icon"><i class="fa-brands fa-whatsapp"></i></div>
<div class="text">HUBUNGI ADMIN<span class="small"></span></div>
</a>

<a class="diamond" href="https://duniagames.co.id/" target="_blank" rel="noopener noreferrer">
<div class="icon"><i class="fa-solid fa-gem"></i></div>
<div class="text">Tempat Top Up Terpercaya<span class="small"></span></div>
</a>

<a class="social" href="https://djuragansosmed.com/" target="_blank" rel="noopener noreferrer">
<div class="icon"><i class="fa-solid fa-users"></i></div>
<div class="text">Suntik Followers All Sosmed<span class="small"></div>
</a>

<button class="back" onclick="showHome(event)"><i class="fa-solid fa-arrow-left"></i>&nbsp;&nbsp;Kembali</button>
</div>
</section>

<div class="footer">© 2026 MAS R ID</div>
</div>

<script>
function showMenu(){
 document.getElementById("home").classList.add("hidden");
 document.getElementById("menuPage").classList.remove("hidden");
}
function showHome(e){
 if(e)e.stopPropagation();
 document.getElementById("menuPage").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}
</script>
</body>
</html>
